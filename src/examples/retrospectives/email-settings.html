<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>邮箱设置 · 改进方案样例</title>
<style>
:root {
  --bg:#f4f3fc;
  --surface:#fff;
  --ink:#252437;
  --muted:#68677b;
  --line:#dedde9;
  --accent:#6557cb;
  color-scheme:light
}
* {
  box-sizing:border-box
}
body {
  margin:0;
  padding:22px 16px;
  background:var(--bg);
  color:var(--ink);
  font:14px/1.7 system-ui,sans-serif
}
.settings {
  max-width:550px;
  margin:auto;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:18px;
  padding:24px
}
h1 {
  font-size:21px;
  margin:0 0 5px
}
.intro,small {
  font-size:12px;
  color:var(--muted)
}
.intro {
  margin:0 0 18px
}
.fields {
  display:grid;
  grid-template-columns:minmax(0,1fr) 120px;
  gap:14px
}
label {
  display:block;
  font-size:13px;
  font-weight:600;
  margin-bottom:6px
}
input,select,button {
  font:inherit;
  color:inherit;
  min-height:44px
}
input,select {
  width:100%;
  padding:9px;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--surface)
}
small {
  display:block;
  margin-top:8px
}
.actions {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:22px
}
button {
  padding:8px 14px;
  border:1px solid var(--line);
  border-radius:9px;
  background:var(--surface);
  cursor:pointer
}
button:first-child {
  color:var(--accent);
  border-color:var(--accent)
}
button:disabled {
  opacity:.6;
  cursor:wait
}
#status {
  padding:12px;
  border-radius:8px;
  background:var(--bg);
  font-size:13px;
  min-height:70px;
  margin-bottom:0
}
.result-choice {
  margin-top:18px
}
:focus-visible {
  outline:2px solid var(--accent);
  outline-offset:3px
}
html[data-theme=dark] {
  --bg:#1e1d29;
  --surface:#292837;
  --ink:#efedf8;
  --muted:#c0bccf;
  --line:#484558;
  --accent:#9985ed;
  color-scheme:dark
}
@media(max-width:420px) {
  .settings {
    padding:18px
  }
  .fields {
    grid-template-columns:1fr 92px
  }
}
</style>
<main class="settings">
<h1>邮件渠道</h1>
<p class="intro">改进方案演示 · 不保存配置，不发送邮件。</p>
<div class="fields">
<div>
<label for="host">SMTP 主机</label>
<input id="host" value="smtp.example.com" readonly>
</div>
<div>
<label for="port">端口</label>
<select id="port">
<option>465</option>
<option>587</option>
</select>
</div>
</div>
<small id="tls">465：连接建立时使用 TLS。</small>
<div class="result-choice">
<label for="outcome">模拟结果</label>
<select id="outcome">
<option value="ok">服务响应正常</option>
<option value="auth">认证失败</option>
<option value="timeout">连接超时</option>
</select>
</div>
<div class="actions">
<button type="button" data-action="verify">检查连接</button>
<button type="button" data-action="send">模拟测试邮件</button>
</div>
<p id="status" role="status" aria-live="polite">连接检查与邮件投递是两个步骤。连接可用，不代表邮件已经进入收件箱。</p>
<small>登录找回密码还需检查系统级 SMTP 配置；用户级通知配置应单独标明。</small>
</main>
<script>
document.documentElement.dataset.theme=new URLSearchParams(location.search).get('theme')||'light';
const port=document.querySelector('#port'),buttons=[...document.querySelectorAll('[data-action]')],status=document.querySelector('#status');
port.addEventListener('change',()=>document.querySelector('#tls').textContent=port.value==='465'?'465：连接建立时使用 TLS。':'587：secure=false 表示先连接，再按服务器能力升级 STARTTLS；不等于关闭加密。');
buttons.forEach(button=>button.addEventListener('click',async()=>{
 buttons.forEach(item=>item.disabled=true);const outcome=document.querySelector('#outcome').value;
 status.textContent='正在模拟检查…';await new Promise(resolve=>setTimeout(resolve,550));
 status.textContent=outcome==='auth'?'演示：认证失败。检查账号、授权方式与服务商要求。':outcome==='timeout'?'演示：连接超时。检查域名、端口与服务器出站连接。':button.dataset.action==='verify'?'演示：连接、TLS 与认证检查通过；尚未发送邮件。':'演示：SMTP 接受消息；真实环境仍需检查收件箱与投递结果。';
 buttons.forEach(item=>item.disabled=false);
}));
</script>
</html>
